# 3D BraTS 2024 GLI Dataset Configuration
dataset_name: "brats_gli_3d"
spatial_shape: [128, 128, 128]
patch_size: [16, 16, 16]
in_channels: 4
modalities: ["t1n", "t1c", "t2w", "t2f"]
binary_target: "WT"  # Whole Tumor (labels > 0)
zscore_non_zero_only: true

# Spatial Augmentations
augmentations:
  modality_dropout_prob: 0.25
  rand_flip_prob: 0.5
  # rand_affine_prob: 0.5  # Omitted: rigid/affine interpolation induces resampling blur on anisotropic voxels
  rand_noise_prob: 0.3
  noise_std: 0.05

# Masking Parameters (Option B: 3D Aspect-Ratio Jitter Target Cuboids, 97 tokens total)
masking:
  target_cuboid_sizes:
    - [3, 3, 3]    # 27 tokens: Macro isotropic cube (48mm)
    - [2, 3, 3]    # 18 tokens: Axial planar slab (32x48x48mm)
    - [3, 2, 3]    # 18 tokens: Coronal planar slab (48x32x48mm)
    - [3, 3, 2]    # 18 tokens: Sagittal planar slab (48x48x32mm)
    - [2, 2, 2]    #  8 tokens: Regional meso cube (32mm)
    - [2, 2, 2]    #  8 tokens: Regional meso cube (32mm)
  max_target_overlap: 0.0
  context_num_patches: 192         # Exactly 192 tokens (37.5% of 512)
  context_connectivity: 26         # 3D BFS connectivity
