# 3D SigReg JEPA Model Configuration (Balestriero & LeCun, 2025)
name: "sigreg_jepa"
spatial_shape: [128, 128, 128]
patch_size: [16, 16, 16]
in_channels: 4
embed_dim: 384
proj_dim: 128
encoder_depth: 8
num_heads: 6
mlp_ratio: 4.0
predictor_depth: 4
predictor_embed_dim: 192

# Epps-Pulley Gaussianity Regularization
sigreg_weight: 1.0
num_projections: 256
t_max: 3.0
n_knots: 17
loss_type: "smooth_l1"
out_channels: 5
