# 3D Self-Supervised JEPA Pre-training Schedule for NVIDIA A100 (Google Colab)
epochs: 50
warmup_epochs: 5
batch_size: 16
learning_rate: 0.0005
min_lr: 0.00001
weight_decay: 0.05
optimizer: "adamw"
betas: [0.9, 0.95]
clip_grad_norm: 1.0
amp: true
save_freq: 5
eval_freq: 5
num_workers: 4
pin_memory: true

# Upgrades A & C: Regularizer Annealing Schedule
reg_warmup_epochs: 15
reg_min_scale: 0.10
