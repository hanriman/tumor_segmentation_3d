# 3D Self-Supervised JEPA Pre-training Schedule (Canonical: 100 epochs, override via CLI --epochs)
epochs: 100
warmup_epochs: 10
batch_size: 4
learning_rate: 0.0005
min_lr: 0.00001
weight_decay: 0.05
reg_warmup_epochs: 15
reg_min_scale: 0.10
optimizer: "adamw"
betas: [0.9, 0.95]
clip_grad_norm: 1.0
amp: true
save_freq: 10
eval_freq: 5

# 3D JEPA Masking Parameters (Option B: Multi-aspect-ratio jitter cuboids)
masking:
  max_target_overlap: 0.0
  context_fraction: 0.375         # 37.5% volume coverage (192 tokens for 8³ grid, 1536 tokens for 16³ grid)
  context_connectivity: 26         # 3D BFS connectivity
  # Default Option B cuboid shapes in token units for 8³ grid (patch_size 16³)
  target_cuboid_sizes_8grid:
    - [3, 3, 3]    # 27 tokens: Macro isotropic cube (48mm)
    - [2, 3, 3]    # 18 tokens: Axial planar slab (32x48x48mm)
    - [3, 2, 3]    # 18 tokens: Coronal planar slab (48x32x48mm)
    - [3, 3, 2]    # 18 tokens: Sagittal planar slab (48x48x32mm)
    - [2, 2, 2]    #  8 tokens: Regional meso cube (32mm)
    - [2, 2, 2]    #  8 tokens: Regional meso cube (32mm)
  # Scaled Option B cuboid shapes in token units for 16³ grid (patch_size 8³) -> identical physical mm coverage
  target_cuboid_sizes_16grid:
    - [6, 6, 6]    # 216 tokens: Macro isotropic cube (48mm)
    - [4, 6, 6]    # 144 tokens: Axial planar slab (32x48x48mm)
    - [6, 4, 6]    # 144 tokens: Coronal planar slab (48x32x48mm)
    - [6, 6, 4]    # 144 tokens: Sagittal planar slab (48x48x32mm)
    - [4, 4, 4]    #  64 tokens: Regional meso cube (32mm)
    - [4, 4, 4]    #  64 tokens: Regional meso cube (32mm)
