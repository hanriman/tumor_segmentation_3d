# 3D Downstream Volumetric Fine-tuning Schedule
epochs: 30
warmup_epochs: 3
batch_size: 2
decoder_type: "multiscale"  # "multiscale" or "bottleneck"
freeze_encoder: false       # false = full fine-tuning, true = frozen linear/decoder probe
learning_rate: 0.0003
min_lr: 0.000001
weight_decay: 0.0001
optimizer: "adamw"
betas: [0.9, 0.999]
clip_grad_norm: 1.0
amp: true
save_freq: 5
eval_freq: 1
